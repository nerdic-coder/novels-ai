<!DOCTYPE html>
<html>
  <head>
    <title>Fable AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-aFq/bzH65dt+w6FI2ooMVUpc+21e0SRygnTpmBvdBgSdnuTN7QbdgL+OapgHtvPp" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body {
        background-color: #171822;
        color: #abfcdd;
      }
      input[type="text"],
      input[type="number"],
      textarea {
        background-color: #21474e;
        color: beige;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="https://storage.googleapis.com/ai-audiobook/audiobook_app-logo.png" style="max-width: 100%;" />
      <div id="fable-page" class="hidden">
        <p>OBS! Generation can take up to a minute for each chapter.</p>
        <form id="fable-form" method="get" onsubmit="generateAudiobook(); return false;">
          <div class="mb-3">
              <label for="chapters" class="form-label">Number of chapters:</label>
              <input type="number" class="form-control" id="chapters" required min="1" max="6" value="1">
          </div>
          <div class="mb-3">
              <label for="genre" class="form-label">Genre:</label>
              <input type="text" class="form-control" id="genre">
          </div>
          <div class="mb-3">
              <label for="style" class="form-label">Author:</label>
              <input type="text" class="form-control" id="style">
          </div>
          <div class="mb-3">
              <label for="title" class="form-label">Title:</label>
              <input type="text" class="form-control" id="title">
          </div>
          <div class="mb-3">
              <label for="starring" class="form-label">Starring:</label>
              <input type="text" class="form-control" id="starring">
          </div>
          <div class="mb-3">
            <input type="submit" value="Generate fable" class="btn btn-primary" id="submit-button">
          </div>
        </form>

        <div id="response"></div>

        <h2>Generated fables</h2>
        <table class="table table-dark table-striped table-bordered table-sm">
          <thead>
            <tr>
              <th>Title</th>
              <th>Genre</th>
              <th>Chapters</th>
            </tr>
          </thead>
          <tbody id="audiobooks-list">

          </tbody>
        </table>
      </div>
      <input type="button" value="Google Signin" class="btn btn-primary" id="sign-in-button">
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: 'AIzaSyBzegpGaNrC-KHupiuNXnjI2XxkoaXzm2o',
        authDomain: 'ai-audiobook.firebaseapp.com',
        databaseURL: 'https://ai-audiobook.firebaseio.com',
        projectId: 'ai-audiobook',
      };
      firebase.initializeApp(firebaseConfig);
      
      const signInButton = document.getElementById('sign-in-button');
      const fablePage = document.getElementById('fable-page');

      // Create a Google sign-in provider
      const provider = new firebase.auth.GoogleAuthProvider();
      // Get the currently signed-in user
      let user = firebase.auth().currentUser;
      if (user) {
        fablePage.classList.remove('hidden');
        signInButton.classList.add('hidden');
      } else {
        fablePage.classList.add('hidden');
        signInButton.classList.remove('hidden');
      }

      firebase.auth().onAuthStateChanged(stateUser => {
        if (stateUser) {
          user = stateUser;
          fablePage.classList.remove('hidden');
          signInButton.classList.add('hidden');
          // Get the audiobooks collection for the current user
          const audiobooksRef = firebase.firestore().collection('users').doc(user.uid).collection('audiobooks');

          // Listen for changes to the audiobooks collection
          audiobooksRef.orderBy('createdDate', 'desc').onSnapshot((snapshot) => {
            // Clear the existing list of audiobooks
            const audiobooksList = document.getElementById('audiobooks-list');
            audiobooksList.innerHTML = '';

            // Loop through the audiobook documents in the snapshot
            snapshot.forEach((doc) => {
              // Get the audiobook data from the document
              const audiobookData = doc.data();

              // Create a new list item for the audiobook
              const audiobookRow = document.createElement('tr');
              const audiobookTitle = document.createElement('td');
              audiobookTitle.textContent = audiobookData.title;

              const audiobookGenre = document.createElement('td');
              audiobookGenre.textContent = audiobookData.genre;

              let audioContent = '';
              // console.log(audiobookData.chapters);
              for (let index = 0; index < audiobookData.chapters.length; index += 1) {
                audioContent += `
                  <p>Chapter ${index + 1}</p>
                  <audio controls>
                    <source src="${audiobookData.chapters[index].chapterUrl}" type="audio/wav">
                    <p>Your browser does not support the audio element</p>
                  </audio>
                  <br>
                `;
              }

              const audiobookLoading = document.createElement('td');
              if (audiobookData.status === 'progress') {
                const spinner = document.createElement('div');
                spinner.classList.add('spinner-border', 'text-success');
                spinner.setAttribute('role', 'status');
                spinner.innerHTML = '<span class="visually-hidden">Loading...</span>';
                audiobookLoading.appendChild(spinner);
              } else {
                audiobookLoading.innerHTML = audioContent;
              }

              audiobookRow.appendChild(audiobookTitle);
              audiobookRow.appendChild(audiobookGenre);
              audiobookRow.appendChild(audiobookLoading);
              // Add the new list item to the list of audiobooks
              audiobooksList.appendChild(audiobookRow);
            });
          });
        } else {
          fablePage.classList.add('hidden');
          signInButton.classList.remove('hidden');
        }
      });

      signInButton.addEventListener('click', async () => {
        try {
          await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.SESSION);
          // Sign in with the Google provider
          const result = await firebase.auth().signInWithPopup(provider);
          user = result.user;
          fablePage.classList.remove('hidden');
          signInButton.classList.add('hidden');
        } catch (error) {
          console.error('Error signing in:', error);
          fablePage.classList.add('hidden');
          signInButton.classList.remove('hidden');
        }
      });

      async function generateAudiobook() {
        const apiUrl = 'https://generate-audiobook-i3rsqvn75a-lm.a.run.app/';

        const formData = new FormData();
        const chapters = document.getElementById('chapters').value;
        formData.append('chapters', chapters);
        formData.append('genre', document.getElementById('genre').value);
        formData.append('title', document.getElementById('title').value);
        formData.append('style', document.getElementById('style').value);
        formData.append('starring', document.getElementById('starring').value);

        // Disable submit button
        const submitButton = document.getElementById('submit-button');
        submitButton.disabled = true;

        const token = await firebase.auth().currentUser.getIdToken();
        fetch(apiUrl + '?' + new URLSearchParams(formData), {
          headers: {
            Authorization: `Bearer ${token}`,
          },
        })
          .then(response => response.text())
          .then(data => {
            submitButton.disabled = false;
            if (data === 'Unauthorized') {
              alert('Your session have expired!');
              fablePage.classList.add('hidden');
              signInButton.classList.remove('hidden');
            }
          })
          .catch(error => {
            console.error(error);
            alert('Generating Audiobook failed, please try again!');
            // Re-enable submit button
            submitButton.disabled = false;
          });
      }
    </script>
  </body>
</html>
