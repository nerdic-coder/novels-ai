      body {
        background-color: #171822;
        color: #abfcdd;
      }
      input[type="text"],
      input[type="number"],
      input[type="email"],

      textarea {
        background-color: #21474e;
        color: beige;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a href="index.html"><img src="/header.png" alt="Novels AI" style="max-width: 100%; min-width: 100%;" /></a>
      <div id="register-page">
        <div class="card text-bg-dark mb-3">
          <div class="card-header">Registration</div>
          <form class="card-body" id="register-form" onsubmit="register(); return false;">
            <div class="mb-3">
              <label for="input-email" class="form-label">Email address</label>
              <input type="email" class="form-control" id="input-email" aria-describedby="emailHelp">
            </div>
            <div class="mb-3">
              <label for="input-password" class="form-label">Password</label>
              <input type="password" class="form-control" id="input-password">
            </div>
            <div class="mb-3">
              <label for="input-confirm-password" class="form-label">Confirm Password</label>
              <input type="password" class="form-control" id="input-confirm-password">
            </div>
            <div class="d-grid gap-2" style="margin-bottom: 15px;">
              <button type="submit" class="btn btn-primary" id="register-button">Register</button>
            </div>
            <div class="mb-3 d-grid gap-2">
              <input type="button" value="Cancel" class="btn btn-secondary" id="cancel-button">
            </div>
          </form>
        </div>
        <img src="/register.png" alt="Walking into Sci-fi world" style="max-width: 100%; min-width: 100%; margin-bottom: 15px;" />
      </div>
    </div>

    <footer class="bg-dark text-center text-lg-start">
      <div class="container p-4">
        <div class="row">
          <div class="col-lg-3 col-md-6 mb-4 mb-md-0">

            <ul class="list-unstyled mb-0">
              <li>
                <a href="index.html" class="text-light">Startpage</a>

              </li>
              <li>
                <a href="register.html" class="text-light">Register</a>
              </li>
              <li>
                <a href="tos.html" class="text-light">Terms of Service</a>
              </li>
              <li>
                <a href="privacy.html" class="text-light">Privacy Policy</a>
              </li>
              <li>
                <a href="contact.html" class="text-light">Contact Us</a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    
      <div class="text-center p-3" style="background-color: rgba(0, 0, 0, 0.2);">
        © 2023 Novels AI
      </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: 'AIzaSyBzegpGaNrC-KHupiuNXnjI2XxkoaXzm2o',
        authDomain: 'ai-audiobook.firebaseapp.com',
        databaseURL: 'https://ai-audiobook.firebaseio.com',
        projectId: 'ai-audiobook',
      };
      firebase.initializeApp(firebaseConfig);
      
      const registerForm = document.getElementById('register-form');
      const cancelButton = document.getElementById('cancel-button');
      
      // Create a Google sign-in provider
      const provider = new firebase.auth.GoogleAuthProvider();
      // Get the currently signed-in user
      let user = firebase.auth().currentUser;
      if (user) {
        window.location.href = 'index.html';
      }

      firebase.auth().onAuthStateChanged(stateUser => {
        if (stateUser) {
          window.location.href = 'index.html';
        }
      });

      cancelButton.addEventListener('click', async () => {
        registerForm.reset();
        window.location.href = 'index.html';
      });

      async function register() {
        const formData = new FormData();
        const email = document.getElementById('input-email').value;
        const password = document.getElementById('input-password').value;
        const confirmPassword = document.getElementById('input-confirm-password').value;

        if (password !== confirmPassword) {
          alert('Passwords do not match');
          return;
        }

        firebase.auth().createUserWithEmailAndPassword(email, password)
          .then(() => {
            console.log('User registered successfully');
            alert('Registration successful!');
            window.location.href = 'index.html';
          })
          .catch((error) => {
            console.error(error.message);
            alert('Failed to register! ', error.message);
          });
      }
    
    </script>
  </body>
</html>
