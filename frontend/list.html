    <div class="container">
      <img src="/img/small-header.png" alt="Novels AI" style="max-width: 100%;" />

      <div class="mb-3 d-grid gap-2">
        <input type="submit" value="Create new novel" class="btn btn-primary" id="create-new-button">

          type="button"
          class="btn btn-success"
          value="Buy 10 points for 5 euro"
          onclick="(async (event) => { await buyPoints(event); })(event)">
      </div>
      <div class="d-grid gap-2" style="margin-bottom: 15px;">
        <input type="button" value="Log out" class="btn btn-warning" onclick="signOut()">

    <script>
      const createNewButton = document.getElementById('create-new-button');
      const loadMoreButton = document.getElementById('load-more-button');
      let storiesShown = STORIES_PER_PAGE;

      loadMoreButton.addEventListener('click', async () => {
        storiesShown += STORIES_PER_PAGE;
        loadNovels();
      });

      createNewButton.addEventListener('click', async () => {
        window.location.href='create.html';
      });

    </script>
