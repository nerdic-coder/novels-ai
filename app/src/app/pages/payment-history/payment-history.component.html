<div class="container">
  <a [routerLink]="['/novels']"><img src="/assets/img/small-header.png" alt="Novels AI" style="max-width: 100%;" /></a>
  <div id="register-page">
    <div class="card text-bg-dark mb-3">
      <table class="table table-dark table-striped table-bordered table-sm" style="margin-bottom: 0;">
        <thead>
          <tr>
            <th>Date</th>
            <th>Amount</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          @for (payment of (payments$ | async); track payment) {
            <tr>
              <td>{{formatDate(payment.created)}}</td>
              <td>{{payment.amount}}</td>
              <td>{{payment.status}}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    <img src="/assets/img/payments.png" alt="Walking into Sci-fi world" style="max-width: 100%; min-width: 100%; margin-bottom: 15px;" />
  </div>
</div>
